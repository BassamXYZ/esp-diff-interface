# =============================================================
#  controllers.yaml
#  Load this with the controller_manager (spawner)
# =============================================================

controller_manager:
  ros__parameters:
    update_rate: 50  # Hz — match CONTROL_HZ in ESP32 config.h

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

# ── Diff drive controller ─────────────────────────────────────
diff_drive_controller:
  ros__parameters:
    # Must match JOINT_LEFT / JOINT_RIGHT in config.h
    left_wheel_names:  ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    # Must match config.h values
    wheel_separation: 0.160   # metres
    wheel_radius:     0.033   # metres

    # Odometry
    pose_covariance_diagonal:     [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal:    [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    open_loop:                    true    # no encoders → trust commanded velocity

    # Velocity limits (tune to your robot)
    linear.x.max_velocity:   0.5   # m/s
    linear.x.min_velocity:  -0.5
    angular.z.max_velocity:  1.5   # rad/s
    angular.z.min_velocity: -1.5

    # Topic that publishes /cmd_vel (from Nav2 or teleop)
    use_stamped_vel: false

    publish_rate: 50.0
